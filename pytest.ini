[pytest]
testpaths = tests api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --cov=schemas
    --cov=api
    --cov=app
    --cov=ingest
    --cov-report=term-missing
    --cov-fail-under=70
markers =
    unit: fast unit tests
    integration: requires postgres or docker
    contract: golden JSONL / API contract tests
    slow: CV or video tests

filterwarnings =
    ignore::DeprecationWarning
