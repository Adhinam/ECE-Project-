# Store Intelligence — production-oriented Compose stack
# Usage:
#   cp .env.example .env   # optional overrides
#   docker compose up --build
#
# Local hot-reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

name: store-intelligence

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-store_intel}:${POSTGRES_PASSWORD:-store_intel_dev}@postgres:5432/${POSTGRES_DB:-store_intel}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}

services:
  postgres:
    image: postgres:16-alpine
    container_name: store-intel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-store_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store_intel_dev}
      POSTGRES_DB: ${POSTGRES_DB:-store_intel}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - store_intel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-store_intel} -d ${POSTGRES_DB:-store_intel}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: store-intel-migrate
    command: alembic upgrade head
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - store_intel
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: store-intel-api
    restart: unless-stopped
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    environment:
      <<: *api-environment
      API_KEY: ${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - store_intel
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: store-intel-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PUBLISH_PORT:-8501}:8501"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DASHBOARD_API_URL: http://api:8000
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-2}
      DEFAULT_STORE_ID: ${DEFAULT_STORE_ID:-store-001}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - store_intel
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: store-intel-pipeline
    profiles:
      - full
    environment:
      <<: *api-environment
      INGEST_API_URL: http://api:8000
      STORE_LAYOUT_PATH: /app/configs/store_layout.yaml
      MODELS_CONFIG_PATH: /app/configs/models.yaml
      EVENTS_OUTPUT_DIR: /data/events
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - pipeline_data:/data
    networks:
      - store_intel
    logging: *default-logging

networks:
  store_intel:
    name: store-intelligence-net
    driver: bridge

volumes:
  postgres_data:
    name: store-intelligence-postgres
  pipeline_data:
    name: store-intelligence-pipeline-data
