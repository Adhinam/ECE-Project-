# Model weights and inference thresholds for the detection pipeline.

detector:
  model_name: yolo26n.pt
  # Preserve low-confidence detections for ByteTrack's second association pass.
  confidence_threshold: 0.1
  imgsz: 640
  cpu_threads: 4  # Tune on the target CPU; shared by all detector entry points.
  # Optional teammate preprocessing; disabled until tested on the sample footage.
  clahe: false
  clahe_clip: 2.0
  clahe_tile: 8
  iou_threshold: 0.45
  person_class_id: 0

tracker:
  tracker_type: deepocsort
  deep_lost_seconds: 10
  deep_proximity: 0.1
  deep_appearance: 0.75
  track_thresh: 0.3
  match_thresh: 0.8
  # Supervision scales this by source FPS / 30: 120 means about 4 seconds.
  track_buffer: 120
  new_track_thresh: 0.6
  identity_enabled: true
  identity_model: yolo26n-reid.onnx
  identity_similarity: 0.55
  identity_margin: 0.08
  identity_memory_seconds: null  # Retain unresolved visits until confirmed exit or run reset.
  identity_max_entries: 500
  identity_sample_seconds: 1

reid:
  enabled: true
  # Lightweight HSV histogram Re-ID (pipeline/reid.py) — not OSNet training
  similarity_threshold: 0.72
  histogram_weight: 0.5
  cosine_weight: 0.5
  gallery_ttl_seconds: 300
  gallery_max_entries: 500
  model_name: histogram_v1  # reserved for future OSNet upgrade

staff:
  enabled: true
  method: zone  # zone | heuristic

calibration:
  method: threshold_v1
  thresholds:
    entry: 0.85
    zone_enter: 0.80
    queue_join: 0.75
